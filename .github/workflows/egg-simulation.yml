name: Egg Simulation Tests
on:
  push:
    branches: [feature/living-egg-v0.2]
  pull_request:
    paths:
      - 'simulation/**'
      - 'tests/**'
      - '.github/workflows/egg-simulation.yml'
  workflow_dispatch:
jobs:
  egg-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests and 1000-egg simulation
        run: node --test tests/*.test.mjs
      - name: Install Chromium browser test dependencies
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start local HTTP server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/wisp-server.log 2>&1 &
      - name: Run browser acceptance suite
        run: npx playwright test tests/browser/egg-browser.spec.mjs --workers=1 --reporter=line
