name: Egg Simulation Tests
on:
  push:
    branches: [feature/living-egg-v0.2]
  pull_request:
    paths:
      - 'simulation/**'
      - 'tests/**'
      - '.github/workflows/egg-simulation.yml'
  workflow_dispatch:
jobs:
  egg-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests and 1000-egg simulation
        run: node --test tests/*.test.mjs
      - name: Install Chromium browser test dependencies
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start local HTTP server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/wisp-server.log 2>&1 &
      - name: Run browser acceptance suite
        run: npx playwright test tests/browser/ --workers=1 --reporter=line
      - name: Verify mobile preview has no horizontal overflow
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          for(const width of [320,360,390,412]){
            const page=await browser.newPage({viewport:{width,height:780},isMobile:true,hasTouch:true});
            await page.goto('http://127.0.0.1:8765/preview/');
            await page.locator('[data-care="warm"]').tap();
            const result=await page.evaluate(()=>({overflow:document.documentElement.scrollWidth>innerWidth+1,buttons:[...document.querySelectorAll('[data-care]')].every(b=>b.getBoundingClientRect().width>=40)}));
            if(result.overflow||!result.buttons)throw Error('Mobile layout failed at '+width+': '+JSON.stringify(result));
            await page.close();
          }
          await browser.close();
          JS
      - name: Capture mobile review screenshot
        run: |
          mkdir -p dist/review
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,hasTouch:true,isMobile:true});
          await page.goto('http://127.0.0.1:8765/preview/');
          await page.screenshot({path:'dist/review/mobile-sanctuary.png',fullPage:true});
          await page.locator('[data-care="warm"]').tap();
          await page.screenshot({path:'dist/review/mobile-after-care.png',fullPage:true});
          await browser.close();
          JS
      - name: Upload mobile review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: project-wisp-mobile-review
          path: dist/review/*.png
          if-no-files-found: error
      - name: Package development preview for review
        run: |
          mkdir -p dist/project-wisp-dev
          cp -r preview simulation assets style.css dist/project-wisp-dev/
          cat > dist/project-wisp-dev/README.txt <<'TXT'
          Project Wisp development-only preview.
          Run a local HTTP server in this folder; index.html is under preview/.
          This is not a production deployment. Main and the live site are unchanged.
          TXT
      - name: Upload development preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-wisp-development-preview
          path: dist/project-wisp-dev
          if-no-files-found: error
